# Configuración del Worker que corre el bot de Telegram.
#
# El despliegue lo hace GitHub Actions: no hace falta instalar nada localmente.
# Los secretos (TELEGRAM_TOKEN, WEBHOOK_SECRET) no van acá, se cargan aparte.

name = "canillita-bot"
main = "bot/worker.js"
compatibility_date = "2026-08-01"

[vars]
SITIO = "https://mcanosam.github.io/canillitadigital"

[observability]
enabled = true
