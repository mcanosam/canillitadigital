<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversá con el diario · Tu Canillita</title>
  <meta name="description" content="Demostración del agente de noticias locales del Alto Valle: conversación por WhatsApp, boletín de radio y edición visual.">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <!-- Cabecera: identidad del producto, no del canal -->
  <header class="masthead">
    <a class="volver" href="../index.html">‹ Volver al inicio</a>
    <p class="masthead__eyebrow">Alto Valle · Río Negro</p>
    <h1 class="masthead__title">Tu Canillita</h1>
    <p class="masthead__line">Noticias del valle, todos los días</p>
  </header>

  <!-- Corondel con la fecha, como el pie de cabezal de un diario -->
  <p class="dateline">
    <span id="today-label">—</span>
    <span>Demostración <span id="version-label"></span></span>
  </p>

  <!-- Secciones fijas: la edición no puede depender de un botón del chat -->
  <nav class="secciones" id="secciones" aria-label="Secciones"></nav>

  <main class="stage">
    <!-- Simulador del canal. No usa marcas ni tipografías de terceros. -->
    <section class="phone" aria-label="Conversación de demostración con Tu Canillita">

      <div class="phone__bar">
        <div class="phone__avatar" aria-hidden="true">TC</div>
        <div class="phone__id">
          <p class="phone__name">Tu Canillita</p>
          <p class="phone__status">en línea · responde al instante</p>
        </div>
      </div>

      <p class="phone__disclaimer">
        Demostración del canal WhatsApp
      </p>

      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-label="Mensajes"></div>

      <div id="quick-replies" class="quick-replies" aria-label="Respuestas rápidas" hidden></div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="visually-hidden" for="composer-input">Escribí tu mensaje</label>
        <input id="composer-input" class="composer__input" type="text"
               placeholder="Escribí “hola” para empezar" maxlength="200">
        <button class="composer__send" type="submit" aria-label="Enviar mensaje">
          <span aria-hidden="true">➤</span>
        </button>
      </form>
    </section>

  </main>

  <!-- Copia embebida del contenido: permite abrir el archivo con doble clic -->
  <script src="../content/content.bundle.js"></script>

  <!-- Orden obligatorio: cada módulo usa los anteriores -->
  <script src="../js/version.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/preferences.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/radio.js"></script>
  <script src="../js/intents.js"></script>
  <script src="../js/responses.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
